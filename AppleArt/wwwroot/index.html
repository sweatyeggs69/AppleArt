<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Apple Music AppleArt</title>
    <meta name="title" content="Apple Music AppleArt">
    <meta name="description" content="Look up Apple Music animated artwork URLs by artist, album, track name, or Apple Music URL.">
    <meta name="keywords" content="apple music, animated artwork, m3u8">
    <meta name="robots" content="index, follow">
    <link rel="icon" href="/assets/favicon.ico" type="image/x-icon">

    <meta property="og:type" content="website">
    <meta property="og:url" content="https://amaa.tromme.app/">
    <meta property="og:title" content="Apple Music AppleArt">
    <meta property="og:description" content="Look up Apple Music animated artwork URLs by artist, album, track name, or Apple Music URL.">
    <meta property="og:image" content="https://amaa.tromme.app/og-image.jpg">
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
    <link rel="stylesheet" href="styles.css">
    <script src="app.js?v=20260412-2" defer></script>
</head>
<body class="min-h-screen flex flex-col items-center p-4 bg-[#121212] text-white selection:bg-pink-500 selection:text-white">

<div class="w-full max-w-5xl flex flex-col lg:flex-row lg:items-start lg:justify-center gap-6 mt-10 z-10">

<div class="glass-panel p-8 rounded-2xl shadow-2xl w-full max-w-md">
    <div class="flex p-1 mb-6 bg-gray-900/50 rounded-xl border border-gray-700/50">
        <button id="tabDetails" class="flex-1 py-2 text-sm font-medium rounded-lg transition-all bg-gradient-to-r from-pink-600 to-orange-500 text-white shadow-lg">Search</button>
        <button id="tabUrl" class="flex-1 py-2 text-sm font-medium rounded-lg transition-all text-gray-400 hover:text-white tab-inactive">URL / Link</button>
    </div>

    <form id="searchForm" class="space-y-4">
        <div id="groupDetails" class="space-y-4">
            <div>
                <label class="block text-sm font-medium text-gray-300 mb-1">Artist</label>
                <input type="text" id="artistInput" placeholder="e.g. Gorillaz"
                       class="w-full px-4 py-2 rounded-lg bg-gray-800/80 border border-gray-700 text-white focus:outline-none focus:border-pink-500 transition-colors">
            </div>
            <div>
                <label class="block text-sm font-medium text-gray-300 mb-1">Album</label>
                <input type="text" id="albumInput" placeholder="e.g. Plastic Beach"
                       class="w-full px-4 py-2 rounded-lg bg-gray-800/80 border border-gray-700 text-white focus:outline-none focus:border-pink-500 transition-colors">
            </div>
            <div>
                <label class="block text-sm font-medium text-gray-300 mb-1">Song <span class="text-gray-500 font-normal text-xs">(Optional, improves accuracy)</span></label>
                <input type="text" id="titleInput" placeholder="e.g. On Melancholy Hill"
                       class="w-full px-4 py-2 rounded-lg bg-gray-800/80 border border-gray-700 text-white focus:outline-none focus:border-pink-500 transition-colors">
            </div>
        </div>

        <div id="groupUrl" class="hidden">
            <label class="block text-sm font-medium text-gray-300 mb-1">Apple Music URL</label>
            <input type="url" id="urlInput" placeholder="https://music.apple.com/..."
                   class="w-full px-4 py-2 rounded-lg bg-gray-800/80 border border-gray-700 text-white focus:outline-none focus:border-pink-500 transition-colors">
        </div>

        <button type="submit" id="submitBtn"
                class="w-full py-3 mt-4 rounded-lg bg-gradient-to-r from-pink-600 to-orange-500 hover:from-pink-500 hover:to-orange-400 font-semibold transition-all transform active:scale-95 flex justify-center items-center gap-2 shadow-lg shadow-pink-500/20">
            <span>Fetch Artwork</span>
            <svg id="loadingSpinner" class="animate-spin h-5 w-5 hidden text-white" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24"><circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle><path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path></svg>
        </button>
    </form>

    <div id="statusMessage" class="mt-4 text-center text-sm hidden"></div>
</div>

<div id="resultsPanel" class="glass-panel p-8 rounded-2xl shadow-2xl w-full max-w-md">
    <div id="artworkMetadata" class="mt-6 mb-2 hidden flex flex-col gap-3 bg-gray-900/60 p-3 rounded-lg border border-gray-700/50 shadow-inner">
        <div class="flex items-center justify-between">
            <div class="truncate pr-2">
                <p id="metaAlbum" class="font-bold text-white text-sm truncate"></p>
                <p id="metaArtist" class="text-xs text-gray-400 truncate"></p>
            </div>
            <div id="cacheBadge" class="hidden shrink-0 items-center gap-1 bg-yellow-500/10 text-yellow-400 px-2 py-1 rounded text-xs font-semibold border border-yellow-500/20" title="Loaded instantly from server cache">
                ⚡ <span class="hidden sm:inline">Cached</span>
            </div>
        </div>

        <div id="variantSelector" class="hidden space-y-2 rounded-lg border border-white/10 bg-white/5 p-3">
            <div class="flex items-start justify-between gap-3 mb-3">
                <div>
                    <p class="text-[11px] font-semibold uppercase tracking-wide text-gray-400">Cover Variant</p>
                    <p id="coverVariantHint" class="text-xs text-gray-500">Choose the artwork style to preview.</p>
                </div>
                <span id="coverVariantSelected" class="shrink-0 rounded-full border border-pink-500/20 bg-pink-500/10 px-2 py-1 text-[11px] font-semibold text-pink-300">Square</span>
            </div>

            <div class="grid grid-cols-2 gap-2">
                <button type="button" id="variantSquareBtn" class="variant-option variant-option-active rounded-lg px-3 py-2 text-left cursor-pointer select-none">
                    <span class="block text-sm font-semibold">Square</span>
                    <span class="block text-[11px] text-gray-400">Classic 1:1 cover</span>
                </button>
                <button type="button" id="variantTallBtn" class="variant-option variant-option-inactive rounded-lg px-3 py-2 text-left cursor-pointer select-none">
                    <span class="block text-sm font-semibold">Tall</span>
                    <span class="block text-[11px] text-gray-400">Portrait cover</span>
                </button>
            </div>
        </div>

    </div>
    
    <div id="videoContainer" class="cover-frame-square mt-6 hidden rounded-lg overflow-hidden shadow-2xl border border-gray-700 relative bg-black">
        <div id="selectedVariantBadge" class="cover-variant-badge">Square Cover</div>
        <video id="artworkVideo" class="w-full h-full object-cover" autoplay loop muted playsinline></video>
    </div>
    <a id="rawLink" href="#" target="_blank" class="block mt-4 text-xs text-center text-pink-400 hover:text-pink-300 hidden truncate transition-colors"></a>
</div>

</div>

<div id="historyContainer" class="w-full max-w-5xl mt-8 hidden">
    <h3 class="text-sm font-semibold text-gray-400 mb-4 uppercase tracking-wider pl-2 text-center md:text-left">
        Last Added To Cache
    </h3>
    <div id="historyFadeWrapper" class="relative">
        <ul id="historyList" class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 gap-3"></ul>
    </div>
</div>


<div id="statsContainer" class="hidden grid grid-cols-2 md:grid-cols-3 gap-4 md:gap-8 mt-12 mb-4 text-sm border-t border-gray-800/50 pt-8 w-full max-w-4xl mx-auto px-4">
    <div class="text-center">
        <span class="block text-gray-500 text-[10px] uppercase tracking-[0.15em] font-bold mb-1">Global Searches</span>
        <span id="statSearches" class="text-lg font-medium text-gray-300">0</span>
    </div>
    <div class="text-center">
        <span class="block text-gray-500 text-[10px] uppercase tracking-[0.15em] font-bold mb-1">Animated Entries</span>
        <span id="statAnimatedEntries" class="text-lg font-medium text-gray-300">0</span>
    </div>
    <div class="text-center">
        <span class="block text-gray-500 text-[10px] uppercase tracking-[0.15em] font-bold mb-1">Total Cache Entries</span>
        <span id="statCacheEntries" class="text-lg font-medium text-gray-300">0</span>
    </div>
</div>

</body>
</html>
